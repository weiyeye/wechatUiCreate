[package]
name = "wechat-dialogue-generator"
version = "0.0.1"
description = "基于 Vue 3 和 Tauri 的微信对话生成器桌面应用"
authors = ["Ele-Cat"]
license = "MIT"
repository = "https://github.com/weiyeye/wechatUiCreate"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wechat_dialogue_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
